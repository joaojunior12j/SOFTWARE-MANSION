services:
  mqtt:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 5
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 5s
    networks:
      - psim

  database:
    image: timescale/timescaledb:2.15.3-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-psim_mansion}"
      POSTGRES_USER: "${POSTGRES_USER:-psim}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD in .env}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - psim

networks:
  psim:
    driver: bridge

volumes:
  mqtt_data:
  mqtt_log:
  postgres_data:

